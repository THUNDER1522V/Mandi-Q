name: MANDIQ CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mandiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r requirements.txt

      - name: Backend Static Code Analysis (Flake8)
        working-directory: ./backend
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/mandiq
          SECRET_KEY: ci_secret_key_testing_only_2026
        run: |
          alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/mandiq
          SECRET_KEY: ci_secret_key_testing_only_2026
          APP_ENV: testing
        run: |
          pytest tests/ -v

  frontend-ci:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Oxlint Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npm test

      - name: Run TypeScript & Vite Production Build
        working-directory: ./frontend
        run: npm run build

  docker-verification:
    name: Docker Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Container Image
        run: |
          docker build -t mandiq-backend:ci ./backend

      - name: Build Frontend Container Image
        run: |
          docker build -t mandiq-frontend:ci ./frontend
