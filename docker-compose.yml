version: '3.8'

services:
  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mandiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mandiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mandiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mandiq-network

  # ── FastAPI Backend & Governance Engine ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandiq-backend
    restart: unless-stopped
    environment:
      APP_NAME: "MANDIQ"
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mandiq}
      SECRET_KEY: ${SECRET_KEY:-mandiq_fairprocure_hmac_secret_key_2026_production}
      SUPERVISOR_MASTER_PIN: ${SUPERVISOR_MASTER_PIN:-1234}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      QR_EXPIRY_HOURS: 72
      QR_ISSUER: "MANDIQ APMC Platform"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mandiq-network

  # ── React Vite Frontend SPA ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandiq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mandiq-network

  # ── Unified Nginx Ingress Gateway ────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    container_name: mandiq-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - mandiq-network

networks:
  mandiq-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
